services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_DB: hellodb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  quarkus-app:
    build: .
    container_name: quarkus-app
    environment:
      QUARKUS_DATASOURCE_URL: jdbc:postgresql://db:5432/hellodb
      QUARKUS_DATASOURCE_USERNAME: user
      QUARKUS_DATASOURCE_PASSWORD: password
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  postgres-data: